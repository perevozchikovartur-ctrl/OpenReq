services:
  openreq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openreq
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/openreq.db
      - ALLOW_REGISTRATION=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=0
      - ENVIRONMENT=production
      - LOCAL_AUTH_ENABLED=${LOCAL_AUTH_ENABLED:-true}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_ROLE_CLIENT_ID=${OIDC_ROLE_CLIENT_ID:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_FRONTEND_URL=${OIDC_FRONTEND_URL:-}
      - OIDC_INSTANCE_ROLE_MAP=${OIDC_INSTANCE_ROLE_MAP:-}
      - OIDC_DEFAULT_WORKSPACE_ID=${OIDC_DEFAULT_WORKSPACE_ID:-}
      - OIDC_WORKSPACE_ROLE_MAP=${OIDC_WORKSPACE_ROLE_MAP:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    volumes:
      - openreq-data:/app/data

volumes:
  openreq-data:
